name: Trigger website deploy

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/superbear-universe/website/dispatches \
            -d '{"event_type":"content-source-updated"}'
